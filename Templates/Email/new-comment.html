<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Новый комментарий</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;background:#f5f7fa;margin:0;padding:32px;">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
  <div style="background:linear-gradient(135deg,#6366f1,#4f46e5);padding:32px 40px;">
    <h1 style="color:#fff;margin:0;font-size:24px;">💬 Новый комментарий</h1>
    <p style="color:#c7d2fe;margin:8px 0 0;">Тикет #{TicketId}</p>
  </div>
  <div style="padding:40px;">
    <p style="color:#374151;font-size:16px;">Здравствуйте, <strong>{Name}</strong>!</p>
    <p style="color:#6b7280;">Пользователь <strong>{Author}</strong> добавил комментарий:</p>
    <div style="background:#f0f0ff;border-left:4px solid #6366f1;border-radius:0 8px 8px 0;padding:16px;margin:20px 0;">
      <p style="margin:0;color:#374151;">{Comment}</p>
    </div>
  </div>
  <div style="background:#f9fafb;padding:16px 40px;border-top:1px solid #e5e7eb;">
    <p style="color:#9ca3af;font-size:12px;margin:0;">© Service Desk Platform · КР Ханников</p>
  </div>
</div>
</body>
</html>
