<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Скоро дедлайн</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;background:#f5f7fa;margin:0;padding:32px;">
<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
  <div style="background:linear-gradient(135deg,#f59e0b,#d97706);padding:32px 40px;">
    <h1 style="color:#fff;margin:0;font-size:24px;">⏰ Скоро дедлайн!</h1>
    <p style="color:#fde68a;margin:8px 0 0;">Тикет #{TicketId}</p>
  </div>
  <div style="padding:40px;">
    <p style="color:#374151;font-size:16px;">Здравствуйте, <strong>{Name}</strong>!</p>
    <p style="color:#6b7280;">Напоминаем, что срок выполнения тикета <strong>#{TicketId}</strong> истекает.</p>
    <div style="background:#fffbeb;border:2px solid #f59e0b;border-radius:8px;padding:16px;text-align:center;margin:20px 0;">
      <p style="margin:0;font-size:13px;color:#92400e;">Дедлайн</p>
      <p style="margin:4px 0 0;font-size:22px;font-weight:bold;color:#b45309;">{DueAt}</p>
    </div>
    <p style="color:#6b7280;">Пожалуйста, завершите работу как можно скорее.</p>
  </div>
  <div style="background:#f9fafb;padding:16px 40px;border-top:1px solid #e5e7eb;">
    <p style="color:#9ca3af;font-size:12px;margin:0;">© Service Desk Platform · КР Ханников</p>
  </div>
</div>
</body>
</html>
